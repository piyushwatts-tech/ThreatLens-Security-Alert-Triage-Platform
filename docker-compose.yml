# ThreatLens: one command brings up the whole platform with sample data.
#   docker compose up --build
#   open http://localhost:3000
# Optional AI summaries: ANTHROPIC_API_KEY=sk-... docker compose up --build
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: threatlens
      POSTGRES_USER: threatlens
      POSTGRES_PASSWORD: threatlens
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U threatlens"]
      interval: 3s
      retries: 20

  ml-service:
    build: { context: ., dockerfile: ml-service/Dockerfile }
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-claude-opus-5-5}
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      retries: 20

  backend:
    build: { context: ., dockerfile: backend/Dockerfile }
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/threatlens
      DB_USER: threatlens
      DB_PASSWORD: threatlens
      ML_SERVICE_URL: http://ml-service:8000
      INGEST_API_KEY: ${INGEST_API_KEY:-}
    depends_on:
      postgres: { condition: service_healthy }
      ml-service: { condition: service_healthy }
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/actuator/health || exit 1"]
      interval: 5s
      retries: 30

  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ["3000:80"]

  # One-shot: loads the bundled CIC-IDS2017 + Windows samples, then exits.
  seed:
    image: curlimages/curl:8.11.1
    depends_on:
      backend: { condition: service_healthy }
    volumes:
      - ./scripts:/scripts:ro
      - ./data/sample:/data/sample:ro
    environment:
      THREATLENS_API: http://backend:8080
      INGEST_API_KEY: ${INGEST_API_KEY:-}
    entrypoint: ["sh", "-c", "sh /scripts/seed-compose.sh"]
    restart: "no"

volumes:
  pgdata:
